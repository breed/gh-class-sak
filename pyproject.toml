[build-system]
requires = ["setuptools>=69", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-class-sak"
version = "0.4.0"
description = "Command-line Swiss Army Knife for managing course repos in a GitHub org"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["github", "classroom", "canvas", "education", "teaching", "course", "grading", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "canvasapi>=3.0",
    "click>=8.1",
    "PyGithub>=2.3",
    "GitPython>=3.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/breed/gh-class-sak"
Source = "https://github.com/breed/gh-class-sak"

[tool.setuptools.packages.find]
include = ["gh_class_sak*"]

[tool.ruff]
# pinned explicitly so CI and a developer's machine agree regardless of any
# ruff config installed globally
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
gh-class-sak = "gh_class_sak.gh_class_sak:main"
